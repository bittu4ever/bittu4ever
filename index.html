<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#cbbff0">
<title>For Yashi — Love Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#34224b;--muted:#6f5c88;--violet:#a987e8;--purple:#7855bd;--plum:#513675;
 --line:rgba(120,90,176,.2);--shadow:0 24px 70px rgba(80,52,130,.18);
 --serif:"Cormorant Garamond",Georgia,serif;--sans:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--hand:Caveat,"Segoe Script",cursive;
 --ease:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
@supports(transition-timing-function:linear(0,1)){:root{--ease:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,1.003,0.995 52.9%,0.993 56.3%,1 71%,1)}}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);overflow-x:hidden;
 background:linear-gradient(180deg,#c6b8ef 0%,#d9ccf7 34%,#eddff9 72%,#f8ecfa 100%) fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--purple)}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.7;animation:drift 20s ease-in-out infinite alternate}
body:before{width:480px;height:480px;background:#f4d3f4;top:-120px;left:-140px}
body:after{width:520px;height:520px;background:#b9a2f0;right:-180px;top:40%;animation-delay:-8s}
@keyframes drift{to{transform:translate(90px,60px) scale(1.18)}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.wrap{width:min(1120px,calc(100% - 38px));margin:auto;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0}
.brand{font-family:var(--serif);font-size:26px;font-style:italic;font-weight:500}
.brand span{color:var(--purple)}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.6);padding:9px 14px;border-radius:99px;color:var(--muted);font-size:13px;backdrop-filter:blur(14px)}
.snow-btn{cursor:pointer;border-radius:18px;transition:background .3s,transform .7s var(--ease),border-radius .7s var(--ease)}
.snow-btn:hover{background:#fff;transform:translateY(-3px);border-radius:10px}
.snow-btn:active{transform:scale(.88);transition-duration:.12s}
.top-r{display:flex;gap:8px;align-items:center}
.hero{position:relative;min-height:clamp(440px,calc(100svh - 110px),700px);border:1px solid rgba(255,255,255,.9);border-radius:34px;padding:clamp(28px,6vw,70px);overflow:hidden;
 background:linear-gradient(120deg,rgba(255,255,255,.8),rgba(232,218,255,.7));box-shadow:var(--shadow);backdrop-filter:blur(22px);display:flex;align-items:center}
.hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:7%;top:-90px;background:radial-gradient(circle,rgba(185,151,244,.5),rgba(244,213,248,.1) 65%,transparent 70%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.2);opacity:.65}}
.hero-copy{position:relative;z-index:2;max-width:660px}
.eyebrow{font-size:14px;font-weight:500;color:#8564b5;letter-spacing:.3px}
h1{font-family:var(--serif);font-size:clamp(54px,9vw,104px);line-height:.95;letter-spacing:-2px;font-weight:500;font-style:italic;margin:14px 0 18px}
h1 em{font-weight:600;background:linear-gradient(100deg,#7855bd,#c08be0,#7855bd);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.lead{color:var(--muted);font-size:16px;line-height:1.8;max-width:460px;margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{border:0;border-radius:24px;padding:14px 22px;background:linear-gradient(115deg,#8f6bce,#b18ce7);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(130,94,190,.28);transition:transform .7s var(--ease),box-shadow .3s,border-radius .7s var(--ease)}
.btn:hover{border-radius:14px;transform:translateY(-4px);box-shadow:0 15px 30px rgba(130,94,190,.36)}
.btn:active{transform:scale(.9);border-radius:12px;transition-duration:.12s}
.btn.secondary{background:rgba(255,255,255,.75);color:var(--plum);border:1px solid var(--line);box-shadow:none}
.floaty{position:absolute;z-index:2;filter:drop-shadow(0 14px 16px rgba(103,72,153,.22));animation:pop 1.4s var(--ease) both,bob 5s ease-in-out 1s infinite}
.heart{right:14%;top:23%;font-size:92px;--d:.7s}
.bow{right:5%;bottom:13%;font-size:58px;--d:.9s;animation-delay:.9s,2.3s}
.butterfly{right:31%;top:12%;font-size:40px;--d:.8s;animation-delay:.8s,2.2s}
.heart{animation-delay:.7s,2.1s}
@keyframes pop{from{opacity:0;scale:0}to{opacity:1;scale:1}}
@keyframes bob{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -16px;rotate:5deg}}
.butterfly{animation-name:pop,flutter}
@keyframes flutter{0%,100%{translate:0 0;rotate:-8deg}30%{translate:14px -14px;rotate:10deg}60%{translate:-6px -24px;rotate:-4deg}}
.section-head{margin:54px 2px 18px}
.section-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5vw,46px);margin:0;letter-spacing:-.5px;line-height:1.05}
.section-head p{margin:8px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.tile{position:relative;text-align:left;border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:22px;min-height:200px;overflow:hidden;cursor:pointer;box-shadow:0 12px 35px rgba(87,62,132,.1);backdrop-filter:blur(18px);transition:transform .8s var(--ease),box-shadow .4s,border-radius .8s var(--ease)}
.tile:active{transform:scale(.94)!important;transition-duration:.12s}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);translate:-120% 0;transition:translate .8s var(--ease)}
.tile:hover:before{translate:120% 0}
.tile:hover{border-radius:40px;transform:translateY(-10px) scale(1.02);box-shadow:0 24px 48px rgba(87,62,132,.18)}
.tile:nth-child(1){background:linear-gradient(145deg,#f7efff,#e6d9ff)}
.tile:nth-child(2){background:linear-gradient(145deg,#fff5fc,#f2ddf6)}
.tile:nth-child(3){background:linear-gradient(145deg,#f3efff,#ded9ff)}
.tile:nth-child(4){background:linear-gradient(145deg,#fff4fa,#f4e2f2)}
.tile-icon{font-size:40px;display:block;margin-bottom:20px;filter:drop-shadow(0 7px 8px rgba(103,72,153,.18));transition:transform .8s var(--ease)}
.tile:hover .tile-icon{transform:scale(1.25) rotate(-10deg)}
.tile h3{margin:0 0 6px;font-size:18px}
.tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.tile .arrow{position:absolute;right:18px;bottom:16px;color:#8b6cb7;font-size:18px;transition:transform .6s var(--ease)}
.tile:hover .arrow{transform:translate(3px,-3px)}
.note{margin-top:22px;padding:26px 30px;border:1px solid rgba(255,255,255,.9);border-radius:24px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;gap:15px}
.note small{color:#7f62a8;font-size:13px;font-weight:700}
.note blockquote{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3.6vw,34px);margin:6px 0 0;line-height:1.2}
.note .sticker{font-size:42px;animation:bob 5s ease-in-out infinite}
footer{position:relative;text-align:center;color:#6f5c88;font-size:13px;padding:48px 0 28px}
footer b{color:#7855bd}
.drift{position:fixed;left:-5%;right:-5%;bottom:-34px;height:70px;z-index:4;pointer-events:none;
 background:radial-gradient(ellipse 22% 100% at 12% 100%,#fff 60%,transparent 61%),radial-gradient(ellipse 28% 100% at 38% 100%,#fff 60%,transparent 61%),radial-gradient(ellipse 24% 100% at 66% 100%,#fff 60%,transparent 61%),radial-gradient(ellipse 26% 100% at 92% 100%,#fff 60%,transparent 61%);
 filter:drop-shadow(0 -6px 14px rgba(255,255,255,.7));opacity:.9}
.rise{opacity:0;animation:rise 1.3s var(--ease) forwards;animation-delay:calc(var(--i,0)*.11s + .1s)}
@keyframes rise{from{opacity:0;translate:0 44px;scale:.9}to{opacity:1;translate:0 0;scale:1}}
.modal{position:fixed;inset:0;z-index:10;background:rgba(43,27,64,.34);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex;animation:fade .3s}
.modal.show.closing{animation:fade .22s reverse forwards}
.modal.closing .dialog{animation:out .22s ease-in forwards}
.dialog{position:relative;width:min(640px,100%);max-height:88vh;overflow:auto;border:1px solid rgba(255,255,255,.95);border-radius:28px;padding:clamp(22px,5vw,40px);background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(242,233,255,.97));box-shadow:0 30px 100px rgba(49,29,79,.3);animation:dlg .9s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dlg{from{opacity:0;transform:translateY(60px) scale(.8)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(14px) scale(.96)}}
.close{float:right;border:0;background:#eee5fa;color:#75579c;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;transition:transform .7s var(--ease),background .3s,border-radius .7s var(--ease)}
.close:hover{transform:rotate(90deg);background:#e2d3f6;border-radius:12px}
.close:active{transform:rotate(90deg) scale(.8);transition-duration:.12s}
.dialog h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,44px);margin:10px 0 12px;line-height:1.05}
.dialog p{color:#5f4e76;line-height:1.8;font-size:15px}
#modal-content>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--k,0)*.07s)}
.envelope-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.envelope{border:1px solid #e7daf8;border-radius:18px;padding:18px;background:linear-gradient(145deg,#fff,#f2eaff);text-align:left;cursor:pointer;transition:transform .7s var(--ease),box-shadow .35s,border-radius .7s var(--ease)}
.envelope:active{transform:scale(.92)!important;transition-duration:.12s}
.envelope:hover{border-radius:28px;transform:translateY(-7px) rotate(-1.5deg);box-shadow:0 14px 26px #d8c8ed}
.envelope span{font-size:28px;display:block;margin-bottom:8px;transition:transform .7s var(--ease)}
.envelope:hover span{transform:translateY(-4px) scale(1.15)}
.envelope b{font-size:14px;color:#5e467a}
.envelope small{display:block;color:#7f6b96;margin-top:5px;font-size:12px}
.letter{position:relative;margin:20px 0;padding:6px 4px 0;transform-origin:top center;animation:unfold 1.2s var(--ease) both}
@keyframes unfold{from{opacity:0;transform:perspective(900px) rotateX(-45deg) scaleY(.55)}to{opacity:1;transform:none}}
.letter p{font-family:var(--serif);font-size:21px;line-height:1.6;color:#4b3a63;margin:0 0 14px;animation:rise .8s var(--ease) both;animation-delay:calc(.35s + var(--k)*.28s)}
.memory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.photo{min-height:170px;border:1px dashed #b49ad9;border-radius:18px;background:linear-gradient(145deg,#f5efff,#fff5fc);display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;position:relative;overflow:hidden;transition:transform .7s var(--ease),border-radius .7s var(--ease)}
.photo:hover{transform:scale(1.05) rotate(-1deg);border-radius:30px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .6s}
.photo label{cursor:pointer;color:#6f5c88;font-size:13px;z-index:1}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo:focus-within{outline:3px solid var(--purple)}
.photo .hint{display:block;font-size:11px;margin-top:7px}
.reason-box{background:linear-gradient(135deg,#e9ddff,#f9e8fa);border-radius:22px;padding:28px;text-align:center;margin-top:18px}
.reason-box .big{font-size:42px;display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{scale:1}15%{scale:1.2}30%{scale:1}45%{scale:1.12}}
.reason-box p{font-family:var(--serif);font-size:clamp(23px,4vw,28px);line-height:1.35;color:#53396f;min-height:3.9em;display:flex;align-items:center;justify-content:center;transition:opacity .3s,translate .8s var(--ease),scale .8s var(--ease)}
.reason-box p.swap{opacity:0;translate:0 30px;scale:.88}
.gift{font-size:96px;display:block;width:100%;background:none;border:0;text-align:center;cursor:pointer;filter:drop-shadow(0 15px 15px #c8b2e8);animation:wiggle 2.8s ease-in-out infinite;transition:scale .8s var(--ease),rotate .8s var(--ease)}
.gift:hover{scale:1.15}
.gift:active{scale:.8;transition-duration:.12s}
.gift.open{animation:none;scale:1.25;rotate:8deg}
@keyframes wiggle{0%,86%,100%{rotate:0}89%{rotate:-9deg}92%{rotate:9deg}95%{rotate:-6deg}98%{rotate:4deg}}
#giftMessage{display:none;text-align:center}
#giftMessage.show{display:block;animation:rise .9s var(--ease) both}
.signature{font-family:var(--hand);font-size:1.35em;color:#7e5fae}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:22px;left:var(--x);top:var(--y);animation:fly 1.7s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}70%{opacity:1}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1)}}
/* ---- Scroll journey ---- */
.progress{position:fixed;top:0;left:0;right:0;height:4px;z-index:6;pointer-events:none}
.progress i{display:block;height:100%;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#b18ce7,#f2a6e0)}
.progress span{position:absolute;top:2px;left:calc(var(--p,0)*(100% - 22px));font-size:20px;filter:drop-shadow(0 3px 4px rgba(103,72,153,.3))}
body:before{transition:background 1.6s}
body[data-ch="0"]:before{background:#ffd0e4}body[data-ch="1"]:before{background:#d3c6ff}body[data-ch="2"]:before{background:#ffd9ef}body[data-ch="3"]:before{background:#c9dcff}body[data-ch="4"]:before{background:#ffd0e4}
.heart{transform:translateY(calc(var(--hs,0)*-90px))}.bow{transform:translateY(calc(var(--hs,0)*-40px))}.butterfly{transform:translateY(calc(var(--hs,0)*-150px))}
.hero-copy{transform:translateY(calc(var(--hs,0)*40px));opacity:calc(1 - var(--hs,0)*.7)}
.cue{position:absolute;left:50%;bottom:20px;translate:-50% 0;z-index:2;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.cue:after{content:"";width:2px;height:26px;border-radius:2px;background:linear-gradient(var(--purple),transparent);animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%{scale:1 0;transform-origin:top}60%{scale:1 1;transform-origin:top}100%{scale:1 1;opacity:0}}
.rv{opacity:0;translate:0 56px;scale:.9;transition:opacity .7s,translate 1.1s var(--ease),scale 1.1s var(--ease);transition-delay:calc(var(--i,0)*.1s)}
.rv.in{opacity:1;translate:0 0;scale:1}
.rv.done{transition-delay:0s}
.chap{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:13vh 0}
.chap.center{align-items:center;text-align:center}
.chap h2{font-family:var(--serif);font-weight:500;font-size:clamp(40px,7vw,76px);line-height:1;letter-spacing:-1px;margin:10px 0 14px}
.center .lead{margin:0 auto}
.head{max-width:640px;margin-bottom:34px}
.bignum{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(150px,30vw,340px);line-height:.85;margin:6px 0;transform:translateY(calc((.5 - var(--pp,0))*110px)) scale(calc(.82 + var(--pp,0)*.22))}
.bignum span{display:block;background:linear-gradient(120deg,#7855bd,#d58ad8);-webkit-background-clip:text;background-clip:text;color:transparent}
.mg{grid-template-columns:repeat(4,1fr);gap:18px}
.pol{background:#fff;padding:10px 10px 40px;border-radius:16px;box-shadow:0 18px 40px rgba(80,52,130,.18);rotate:var(--r,0deg);transition:opacity .7s,translate 1.1s var(--ease),scale 1.1s var(--ease),rotate .8s var(--ease)}
.pol.in:hover{rotate:0deg;scale:1.05}
.pol .photo{aspect-ratio:3/4;min-height:0;border-radius:10px;border:0}
.pol .photo img{object-position:50% 30%;cursor:zoom-in}
.zoom{width:100%;display:block;border-radius:18px}
.eg{grid-template-columns:repeat(4,1fr);margin-top:0}
.eg>.rv{display:flex}.eg .envelope{width:100%}
.pin{position:relative;margin:6vh 0}
.stage{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.stage .big{font-size:56px;animation:beat 1.6s ease-in-out infinite}
.rwrap{position:relative;width:100%;height:42vh}
.reason{position:absolute;inset:0;margin:auto;height:fit-content;max-width:min(780px,90vw);font-family:var(--serif);font-style:italic;font-size:clamp(32px,6vw,62px);line-height:1.12;opacity:0;translate:0 70px;scale:.85;transition:opacity .5s,translate 1s var(--ease),scale 1s var(--ease)}
.reason.on{opacity:1;translate:0 0;scale:1}
.reason.past{translate:0 -70px;scale:1.06}
.dots{display:flex;gap:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(120,90,176,.28);transition:background .4s,scale .7s var(--ease)}
.dots i.on{background:var(--purple);scale:1.35}
.center #giftMessage{max-width:520px;margin:14px auto 0;font-size:18px;line-height:1.7;color:#5f4e76}
.fq{font-family:var(--serif);font-style:italic;font-size:clamp(28px,5vw,48px);margin:40px 0 0;line-height:1.15}
@media(max-width:760px){.mg,.eg{grid-template-columns:repeat(2,1fr)}.chap{padding:10vh 0}}
body.locked .progress{opacity:0}
.progress{transition:opacity .8s}
/* ---- Cake + night ---- */
body[data-ch="4"]:before{background:#ffdcc8}body[data-ch="5"]:before{background:#ffd0e4}
.cake{position:relative;width:min(280px,80vw);height:262px;margin:30px auto 0;cursor:pointer;filter:drop-shadow(0 24px 30px rgba(80,52,130,.28));transition:transform .8s var(--ease)}
.cake:hover{transform:scale(1.04) rotate(-1deg)}.cake:active{transform:scale(.95);transition-duration:.12s}
.cake .tier{position:absolute;left:50%;translate:-50% 0;border-radius:18px 18px 10px 10px}
.cake .tier:before{content:"";position:absolute;left:0;right:0;top:0;height:36px;background:radial-gradient(circle at 14px 24px,#fff 11px,transparent 12px) 0 0/28px 36px repeat-x,linear-gradient(#fff,#fff) 0 0/100% 24px no-repeat}
.cake .tier:after{content:"";position:absolute;inset:44px 8px 8px;background:radial-gradient(circle at 20% 30%,#ff7fc0 2px,transparent 3px),radial-gradient(circle at 70% 65%,#7fa8ff 2px,transparent 3px);background-size:42px 28px}
.t1{width:66%;height:80px;bottom:100px;background:linear-gradient(180deg,#e9d8ff,#c4a2f0)}
.t2{width:100%;height:98px;bottom:12px;background:linear-gradient(180deg,#ffd6ec,#f2a0d4)}
.plate{position:absolute;left:-6%;right:-6%;bottom:0;height:24px;border-radius:50%;background:linear-gradient(#fff,#e4d8f6);box-shadow:0 8px 14px rgba(80,52,130,.2)}
.candles{position:absolute;left:50%;translate:-50% 0;bottom:178px;width:60%;display:flex;justify-content:space-around;z-index:2}
.candle{position:relative;display:block;width:9px;height:36px;border-radius:3px 3px 1px 1px;background:repeating-linear-gradient(135deg,#fff 0 5px,#b79bf0 5px 10px)}
.flame{position:absolute;left:50%;bottom:100%;width:13px;height:22px;margin:0 0 3px -6.5px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 72%,#fff7cc,#ffc94d 55%,#ff8a3d);box-shadow:0 0 20px 7px rgba(255,190,80,.5);transform-origin:50% 100%;animation:flick .32s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.14) rotate(3deg)}}
.candle.out .flame{animation:none;scale:0;opacity:0;transition:scale .5s var(--ease),opacity .35s}
.candle.out:after{content:"";position:absolute;left:50%;bottom:100%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(130,110,160,.5);animation:smoke 1.7s ease-out forwards}
@keyframes smoke{to{translate:6px -56px;scale:4;opacity:0}}
.wish{display:none;max-width:520px;margin:18px auto 0;font-size:18px;line-height:1.7;color:#5f4e76}
.wish.show{display:block;animation:rise 1s var(--ease) both}
.cf{position:fixed;top:-16px;height:12px;z-index:20;border-radius:2px;pointer-events:none;animation:cfall var(--t) cubic-bezier(.3,.6,.5,1) forwards}
@keyframes cfall{to{transform:translate(var(--dx),112vh) rotate(720deg)}}
.nightsky{position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 125%,#4a3590,transparent 60%),linear-gradient(180deg,#0d0a22,#1a1240 55%,#2b1c57)}
.nightsky:before,.nightsky:after{content:"";position:absolute;inset:0}
.nightsky:before{background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 20px,#e9ddff,transparent),radial-gradient(1px 1px at 230px 120px,#fff,transparent);background-size:260px 160px}
.nightsky:after{background:radial-gradient(1.5px 1.5px at 50px 100px,#fff,transparent),radial-gradient(1px 1px at 140px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 250px 70px,#fff,transparent);background-size:310px 190px;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.1}to{opacity:.95}}
.moon{position:absolute;right:9%;top:9%;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffcec,#efe4bd);box-shadow:0 0 60px 22px rgba(255,244,200,.28)}
#fireflies{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;opacity:0;transition:opacity 1.2s}
body.night .nightsky{opacity:1}
body.night{--ink:#f1eaff;--muted:#c3b5e6;--line:rgba(190,170,240,.3);--shadow:0 24px 70px rgba(0,0,0,.45)}
body.night:before{background:#5a3fb0;opacity:.3}body.night:after{background:#2f4fb0;opacity:.3}
body.night[data-ch]:before{background:#5a3fb0}
body.night .drift{opacity:.3}
body.night .hero{background:linear-gradient(120deg,rgba(40,28,84,.84),rgba(72,46,124,.62));border-color:rgba(190,170,240,.25)}
body.night .pill{background:rgba(40,30,80,.62);color:var(--muted)}
body.night .snow-btn:hover{background:rgba(80,58,150,.92)}
body.night .eyebrow{color:#c9b3ff}
body.night .btn.secondary{background:rgba(255,255,255,.1);color:#efe6ff}
body.night .dialog{background:linear-gradient(145deg,rgba(34,24,72,.98),rgba(54,36,104,.98));border-color:rgba(190,170,240,.25)}
body.night .dialog p,body.night .letter p,body.night .center #giftMessage,body.night .wish{color:#e6dbfb}

body.night .envelope b{color:#f1e9ff}body.night .envelope small{color:#c3b5e6}
body.night .close{background:#3a2a74;color:#e8dcff}

.endsec{display:flex;justify-content:center;padding:4vh 0 12vh}
.sticky{position:relative;max-width:420px;padding:34px 30px 28px;background:linear-gradient(160deg,#ffe0ee,#ffc9e0);border-radius:6px 6px 14px 6px;box-shadow:0 18px 36px rgba(80,52,130,.22);rotate:-2deg;text-align:center}
.sticky p{margin:0;font-family:var(--hand);font-size:clamp(24px,5vw,30px);line-height:1.3;color:#7b3f68}
.tape{position:absolute;top:-14px;left:50%;width:96px;height:28px;translate:-50% 0;rotate:2deg;background:repeating-linear-gradient(90deg,rgba(255,170,205,.85) 0 10px,rgba(255,200,222,.85) 10px 20px);box-shadow:0 2px 6px rgba(80,52,130,.15)}
/* ---- Gate ---- */
body.locked{overflow:hidden}
body.locked .rise,body.locked .floaty{animation:none!important;opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gate{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.5),rgba(190,174,236,.88));backdrop-filter:blur(26px);transition:opacity .9s ease,backdrop-filter .9s ease}
.gate.leave{opacity:0;backdrop-filter:blur(0);pointer-events:none}
.gate-card{width:min(440px,100%);text-align:center;padding:clamp(28px,6vw,44px);border-radius:36px;border:1px solid #fff;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(240,230,255,.84));box-shadow:var(--shadow);animation:dlg 1.1s var(--ease) both;transition:scale .9s ease}
.gate.leave .gate-card{scale:1.12}
.seal{position:relative;width:84px;height:84px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 35% 30%,#dcc6ff,#9a74d8);box-shadow:0 14px 30px rgba(120,85,189,.35),inset 0 -6px 12px rgba(80,50,140,.25);animation:beat 2.2s ease-in-out infinite}
.seal:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(169,135,232,.55);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{opacity:.9;scale:.9}to{opacity:0;scale:1.5}}
.gate h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,6vw,38px);line-height:1.1;margin:8px 0 0}
.gate-sub{color:var(--muted);font-size:15px;line-height:1.6;margin:10px 0 0}
.gate input{width:100%;margin-top:22px;border:1.5px solid var(--line);border-radius:26px;padding:15px 20px;font:inherit;font-size:17px;text-align:center;background:rgba(255,255,255,.9);color:var(--ink);transition:border-radius .7s var(--ease),box-shadow .3s,scale .7s var(--ease),border-color .3s}
.gate input:focus{border-radius:14px;scale:1.03;border-color:var(--purple);box-shadow:0 0 0 5px rgba(169,135,232,.28)}
.gate .btn{width:100%;margin-top:14px}
.gate-msg{min-height:1.7em;margin:14px 0 0;font-size:14px;line-height:1.6;color:#6f4fa0}
.link{background:none;border:0;padding:6px;color:var(--purple);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.shake{animation:shake .6s var(--ease)}
@keyframes shake{0%,100%{translate:0}15%{translate:-14px}30%{translate:11px}45%{translate:-8px}60%{translate:5px}80%{translate:-2px}}
.gate-welcome{display:none}
.gate-card.done .gate-ask{display:none}
.gate-card.done .gate-welcome{display:block;animation:rise 1s var(--ease) both}
.gate-card.done .seal{animation:pop 1s var(--ease) both}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:420px}.heart{right:8%;top:17%;font-size:64px;opacity:.75}.bow{font-size:44px}.hero-copy{max-width:88%}.section-head{margin-top:38px}}
@media(max-width:430px){.wrap{width:calc(100% - 24px)}.pill.hide-s{display:none}.hero{padding:26px 22px;border-radius:26px;min-height:440px}.hero-copy{max-width:100%}.heart{top:auto;bottom:18px;right:16%;font-size:56px}.bow{bottom:8px;right:4%;font-size:36px}.butterfly{right:9%;top:9%;font-size:30px}.grid{gap:10px}.tile{padding:16px;min-height:176px;border-radius:20px}.tile-icon{font-size:32px}.tile h3{font-size:16px}.note{padding:20px}.photo{min-height:135px}.letter p{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}

const letters=[
["💗","Open whenever you feel unloved or after we had a fight",`Hiii cutie, just to let you know my love never fades for you even the slightest. No matter how much we quarrel, argue, fighttt..

You'll always have my heart, and btw ye abhi ladai k baad hi ye likh rha hu 😭. It's just like airrrr, you might not see it, but it's always there 😼.`],
 ["💌","Open when you miss me",`cutie if you ever miss me and unfortunately I'm not around, humare pyare pyare cutu cutu chats padh liya karo bittu badmos, it really helps 😋`],
 ["🧸","Open when you're feeling lonely",`if you ever feel lonely just remember, I'm always a text or a call away my sweet bachha, you can always let out anything you wanna share. I'll always be there for you.`],
 ["🌧️","Open when you're sad","Hey Bittu, take a breath. You don't have to have everything figured out right now, and you don't have to pretend to be okay. Be gentle with yourself. You deserve patience, kindness and all the soft things this world can offer.\n\nI wish I could make today lighter. Sending you the warmest hug. — Siddhant"],
 ["💜","Open when you need love","Here's your reminder: you are loved, appreciated and important. Not just on your best days, not just when you're smiling — on every ordinary, messy, wonderful day too.\n\nYou mean so much to me, Bittu. — Siddhant"],
 ["🌙","Open before sleeping","Let the day go, Bittu. Put down the worries you can't solve tonight. I hope your mind feels quiet, your dreams feel gentle and tomorrow brings you something to smile about.\n\nGoodnight, beautiful. — Siddhant"],
 ["🫂","Open when you need a hug","Consider this letter a long, warm hug that lasts as long as you need. No explanations required. Just a reminder that you matter, and you never have to earn affection by being perfect.\n\nA big hug from me to you. — Siddhant"],
 ["✨","Open when you doubt yourself","I hope you can see even a little of what I see in you: someone special, capable and full of beautiful little qualities. Please don't let one difficult moment make you question your worth.\n\nKeep being you, Bittu. — Siddhant"],
 ["🎂","Open on your birthday","Happy birthday, Yashi! I hope this new year of your life brings you happiness that feels peaceful, dreams that come closer and countless reasons to smile. You deserve to feel celebrated today and every day.\n\nI'm so glad this world has you in it. With love, Siddhant."]
];

 "Your smile has a way of making an ordinary moment feel special.",

];
let reasonIndex=0,lastFocus=null,urls={};
const $=id=>document.getElementById(id);let modal,root;

function render(html){root.innerHTML=html;[...root.children].forEach((c,i)=>c.style.setProperty('--k',i))}
function openModal(which){
 const views={
  welcome:`<div class="eyebrow">A tiny note before you explore</div><h2>Hi, Bittu. ♡</h2><p>I made this little place for you. It's filled with things I wanted you to be able to come back to — letters for different moods, memories we'll add together, and reminders of how special you are to me.</p><p class="signature">With love, Siddhant</p>`,
  letters:`<div class="eyebrow">For every kind of day</div><h2>Open when... 💌</h2><p>Choose an envelope. There's a little note inside, written just for you.</p><div class="envelope-grid">${letters.map((l,i)=>`<button class="envelope" data-letter="${i}"><span>${l[0]}</span><b>${l[1]}</b><small>Tap to open ↗</small></button>`).join('')}</div>`,

  reasons:`<div class="eyebrow">A hundred little things (starting here)</div><h2>Reasons I love you 💗</h2><div class="reason-box"><div class="big">💜</div><p id="reasonText">${reasons[reasonIndex]}</p><button class="btn" data-next>Another reason ✨</button></div><p style="font-size:12px;text-align:center">A little collection that can grow as we add your own memories.</p>`,
  surprise:`<div class="eyebrow">One last little thing</div><h2>A gift, from me to you.</h2><p>Tap the gift. 💜</p><button class="gift" data-gift aria-label="Open your gift">🎁</button><p id="giftMessage">Happy birthday, Yashi. I hope you always remember how loved you are. Here's to more smiles, more memories and more little adventures together. <span class="signature">— Siddhant</span></p>`

 if(!modal.classList.contains('show'))lastFocus=document.activeElement;

}
function closeModal(){
 if(!modal.classList.contains('show')||modal.classList.contains('closing'))return;

function showLetter(i){
 const l=letters[i];
 render(`<div class="eyebrow">A letter for you</div><h2>${l[0]} ${l[1]}</h2><div class="letter">${l[2].split('\n\n').map((p,k)=>`<p style="--k:${k}">${p}</p>`).join('')}</div><button class="btn secondary" data-back>← Back to envelopes</button>`);
}
function nextReason(){
 const p=$('reasonText');reasonIndex=(reasonIndex+1)%reasons.length;p.classList.add('swap');
 setTimeout(()=>{p.textContent=reasons[reasonIndex];p.classList.remove('swap')},250);
}
function previewPhoto(input,n){
 const file=input.files[0];if(!file)return;
 if(urls[n])URL.revokeObjectURL(urls[n]);urls[n]=URL.createObjectURL(file);
 $('photo'+n).innerHTML=`<img src="${urls[n]}" alt="Your memory ${n}"><label style="position:absolute;bottom:8px;background:#ffffffe6;padding:6px 12px;border-radius:20px">Change photo<input type="file" accept="image/*" data-photo="${n}"></label>`;
}
function burst(el){
 const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,set=['💜','💗','✨','❄️','🦋','🎀'];
 for(let i=0;i<30;i++){
  const s=document.createElement('span'),a=Math.random()*6.283,d=90+Math.random()*190;
  s.className='burst';s.textContent=set[i%set.length];
  s.style.cssText=`--x:${cx}px;--y:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-70}px;--r:${(Math.random()-.5)*160}deg;font-size:${16+Math.random()*16}px;animation-delay:${Math.random()*.15}s`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),2000);
 }
}
function revealGift(el){
 if(el.classList.contains('open'))return;
 el.textContent='💝';el.classList.add('open');$('giftMessage').classList.add('show');
 burst(el);snow.boost=1;if(!snow.mode&&!snow.reduce&&!document.body.classList.contains('night'))setMode(1);
}

document.addEventListener('click',e=>{
 const t=e.target,q=s=>t.closest(s);
 if(t===modal||q('[data-close]'))return closeModal();
 let b;
 if(b=q('[data-open]'))openModal(b.dataset.open);
 else if(b=q('[data-letter]')){if(!modal.classList.contains('show'))openModal('letters');showLetter(+b.dataset.letter)}
 else if(b=q('[data-zoom]')){openModal('welcome');render(`<img class="zoom" src="${b.src}" alt="${b.alt}">`)}
 else if(b=q('[data-go]'))document.getElementById(b.dataset.go).scrollIntoView({behavior:snow.reduce?'auto':'smooth'});
 else if(q('[data-back]'))openModal('letters');
 else if(q('[data-next]'))nextReason();
 else if(b=q('[data-gift]'))revealGift(b);
});
document.addEventListener('change',e=>{if(e.target.matches('[data-photo]'))previewPhoto(e.target,e.target.dataset.photo)});
document.addEventListener('keydown',e=>{
 if(!modal||!modal.classList.contains('show'))return;
 if(e.key==='Escape')return closeModal();
 if(e.key==='Tab'){
  const f=[...modal.querySelectorAll('button,input,[href]')].filter(x=>x.type!=='file'||x.closest('label'));
  const items=[...modal.querySelectorAll('button,label')];
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});

/* ---- Snow ---- */
const snow={mode:1,boost:0,reduce:matchMedia('(prefers-reduced-motion:reduce)').matches};
const cv=$('snow'),ctx=cv.getContext('2d'),names=['off','gentle','flurry'];
let W,H,flakes=[],mx=-999,my=-999,last=0,raf=0;
const sprite=document.createElement('canvas');sprite.width=sprite.height=32;
{const g=sprite.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);
 r.addColorStop(0,'#fff');r.addColorStop(.5,'rgba(255,255,255,.85)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,32,32)}
function mk(init){const z=Math.random();return{x:Math.random()*W,y:init?Math.random()*H:-20,z,r:2.5+z*z*8,v:22+z*68,p:Math.random()*6.28,s:.5+Math.random()*1.1,vx:0}}
function fit(){
 const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 const n=Math.round(Math.min(150,W/9)*(snow.mode===2?2:1));
 while(flakes.length<n)flakes.push(mk(true));flakes.length=n;
}
function tick(t){
 const dt=Math.min((t-last)/1000||0,.05);last=t;ctx.clearRect(0,0,W,H);
 snow.boost=Math.max(0,snow.boost-dt/4.5);snow.push=Math.max(0,(snow.push||0)-dt*1.5);
 const sp=(snow.mode===2?1.35:1)+snow.boost*1.5+snow.push*1.4,wind=Math.sin(t/4500)*16+snow.boost*45-snow.push*(snow.dir||0)*25;
 for(const f of flakes){
  f.p+=dt*f.s;f.y+=f.v*dt*sp;
  const dx=f.x-mx,dy=f.y-my,d2=dx*dx+dy*dy;
  if(d2<16900){const d=Math.sqrt(d2)||1;f.vx+=dx/d*(130-d)*dt*5}
  f.vx*=.95;f.x+=(Math.sin(f.p)*20*(.4+f.z)+wind*(.3+f.z)+f.vx)*dt;
  if(f.y>H+20){f.y=-20;f.x=Math.random()*W}
  if(f.x>W+20)f.x=-20;else if(f.x<-20)f.x=W+20;
  ctx.globalAlpha=.4+f.z*.55;ctx.drawImage(sprite,f.x-f.r,f.y-f.r,f.r*2,f.r*2);
 }
 raf=requestAnimationFrame(tick);
}
function setMode(m){
 snow.mode=m;const sb=$('snowBtn');if(sb)sb.textContent='❄ Snow: '+names[m];cancelAnimationFrame(raf);
 if(m){fit();last=performance.now();raf=requestAnimationFrame(tick)}else ctx.clearRect(0,0,W,H);
}
addEventListener('resize',()=>snow.mode&&fit());
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
addEventListener('pointerleave',()=>{mx=my=-999});
fit();setMode(snow.reduce?0:1);

function confetti(){
 const cols=['#a987e8','#f2a6e0','#ffffff','#ffd9ef','#c9dcff','#ffe08a'];
 for(let i=0;i<80;i++){const e=document.createElement('i');e.className='cf';
  e.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%6]};width:${6+Math.random()*7}px;--dx:${(Math.random()-.5)*180}px;--t:${2.4+Math.random()*1.8}s;animation-delay:${Math.random()*.5}s;rotate:${Math.random()*360}deg`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),5200)}
}
function initCake(){
 const cake=$('cake'),cs=[...cake.querySelectorAll('.candle')],msg=$('wishMsg'),mic=$('micBtn'),hint=$('cakeHint');
 let lit=cs.length,done=false,stream=null,ac=null,raf2=0;
 const stopMic=()=>{cancelAnimationFrame(raf2);if(stream)stream.getTracks().forEach(t=>t.stop());if(ac)ac.close().catch(()=>{});stream=ac=null;mic.textContent='🎤 Blow with your mic'};
 const win=()=>{done=true;stopMic();mic.hidden=true;msg.classList.add('show');hint.textContent='Happy birthday! 🎉';burst(cake);confetti();snow.boost=1};
 const next=()=>{const c=cs.find(x=>!x.classList.contains('out'));if(!c)return;c.classList.add('out');if(--lit===0)win()};
 const blowAll=()=>{if(done)return;cs.forEach((c,i)=>setTimeout(next,i*150))};
 cake.addEventListener('click',blowAll);
 cake.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blowAll()}});
 $('relight').addEventListener('click',()=>{cs.forEach(c=>c.classList.remove('out'));lit=cs.length;done=false;mic.hidden=false;msg.classList.remove('show');hint.textContent='Tap the cake, or blow into your mic.'});
 mic.addEventListener('click',async()=>{
  if(stream||done)return;
  try{
   stream=await navigator.mediaDevices.getUserMedia({audio:true});
   ac=new(window.AudioContext||window.webkitAudioContext)();
   const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(stream).connect(an);
   const buf=new Uint8Array(an.fftSize);let acc=0;mic.textContent='🎤 Listening… blow!';
   const loop=()=>{an.getByteTimeDomainData(buf);let sum=0;for(const v of buf){const d=(v-128)/128;sum+=d*d}
    acc=Math.sqrt(sum/buf.length)>.12?acc+1:Math.max(0,acc-2);
    if(acc>14){acc=0;next()}
    raf2=requestAnimationFrame(loop)};loop();
  }catch(e){stopMic();hint.textContent='The mic isn’t available here, so just tap the cake 💜'}
 });
}
function initNight(){
 const b=$('nightBtn'),cvf=document.createElement('canvas'),fx=cvf.getContext('2d'),spr=document.createElement('canvas');
 cvf.id='fireflies';cvf.setAttribute('aria-hidden','true');document.body.appendChild(cvf);
 spr.width=spr.height=64;
 {const g=spr.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,252,210,1)');r.addColorStop(.2,'rgba(225,255,140,.8)');r.addColorStop(.55,'rgba(190,255,120,.2)');r.addColorStop(1,'rgba(190,255,120,0)');g.fillStyle=r;g.fillRect(0,0,64,64)}
 let on=false,raf3=0,last3=0,W2=0,H2=0,ff=[],prevSnow=1;
 const mkf=()=>({x:Math.random()*W2,y:Math.random()*H2,a:Math.random()*6.28,v:10+Math.random()*22,p:Math.random()*6.28,bs:.5+Math.random()*1,r:9+Math.random()*13});
 const fit=()=>{const d=Math.min(devicePixelRatio||1,2);W2=innerWidth;H2=innerHeight;cvf.width=W2*d;cvf.height=H2*d;fx.setTransform(d,0,0,d,0,0);
  const n=Math.max(14,Math.min(42,Math.round(W2/36)));while(ff.length<n)ff.push(mkf());ff.length=n};
 const loop=t=>{
  const dt=Math.min((t-last3)/1000||0,.05);last3=t;fx.clearRect(0,0,W2,H2);fx.globalCompositeOperation='lighter';
  for(const f of ff){
   f.a+=Math.sin(t/1000*f.bs+f.p)*dt*2;
   let vx=Math.cos(f.a)*f.v,vy=Math.sin(f.a)*f.v;
   const dx=mx-f.x,dy=my-f.y,d=Math.hypot(dx,dy);
   if(d<260&&d>1){vx+=dx/d*34;vy+=dy/d*34}
   f.x+=vx*dt;f.y+=vy*dt;
   if(f.x<-20)f.x=W2+20;else if(f.x>W2+20)f.x=-20;if(f.y<-20)f.y=H2+20;else if(f.y>H2+20)f.y=-20;
   const s=Math.max(0,Math.sin(t/1000*f.bs*2+f.p));fx.globalAlpha=.2+.8*s*s;
   fx.drawImage(spr,f.x-f.r,f.y-f.r,f.r*2,f.r*2);
  }
  fx.globalCompositeOperation='source-over';raf3=requestAnimationFrame(loop);
 };
 const set=v=>{
  if(v&&!on&&snow.mode)prevSnow=snow.mode;
  on=v;document.body.classList.toggle('night',v);
  if(v)setMode(0);else if(!snow.reduce&&!snow.mode)setMode(prevSnow);b.textContent=v?'☀️ Day':'🌙 Night';b.setAttribute('aria-pressed',v);
  document.querySelector('meta[name=theme-color]').content=v?'#1a1240':'#cbbff0';
  cancelAnimationFrame(raf3);cvf.style.opacity=v?1:0;
  if(v&&!snow.reduce){fit();last3=performance.now();raf3=requestAnimationFrame(loop)}
  try{sessionStorage.setItem('bd-night',v?'1':'0')}catch(e){}
 };
 b.addEventListener('click',()=>set(!on));
 addEventListener('resize',()=>on&&fit());
 let st=null;try{st=sessionStorage.getItem('bd-night')}catch(e){}
 const h=new Date().getHours();set(st!==null?st==='1':(h>=19||h<6));
}
function mount(){
 if($('modal'))return;
 document.body.appendChild($('site').content.cloneNode(true));
 modal=$('modal');root=$('modal-content');
 const sb=$('snowBtn');sb.textContent='❄ Snow: '+names[snow.mode];sb.addEventListener('click',()=>setMode((snow.mode+1)%3));
 initJourney();initCake();initNight();
}
/* ---- Gate: edit these ---- */
const GATE={
 question:"What’s the date we became “us”?",
 answers:["30 june","30th june","30 jun","june 30","june 30th","jun 30","30th of june","30/06","30-06","30.06","30/6","30-6","6/30","06/30"],
 date:{day:30,month:6},
 welcome:"Welcome in, Bittu ♡",
 remember:true
};
{
 const gate=$('gate'),card=$('gateCard'),form=$('gateForm'),inp=$('gateInput'),msg=$('gateMsg');
 const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
 const norm=v=>v.toLowerCase().replace(/[^a-z0-9]/g,''),oks=GATE.answers.map(norm);
 const nope=["Hmm, not quite. Try once more 💜","So close… think of what I call you 🦋","Not that one, but I like the effort ✨"];
 const ok=raw=>{if(oks.includes(norm(raw)))return true;if(!GATE.date)return false;const t=raw.toLowerCase().match(/\d+|[a-z]+/g)||[];return t.some(x=>+x===GATE.date.day)&&t.some(x=>x.startsWith(MONTHS[GATE.date.month-1])||+x===GATE.date.month)};
 let wrong=0,done=false;
 const open=()=>{mount();document.body.classList.remove('locked')};
 $('gateQ').textContent=GATE.question;$('gateWelcome').textContent=GATE.welcome;
 let seen=false;try{seen=GATE.remember&&sessionStorage.getItem('bd-open')==='1'}catch(e){}
 if(seen){open();gate.remove()}
 else{
  setTimeout(()=>inp.focus({preventScroll:true}),1000);
  const go=()=>{
   if(done)return;
   const v=norm(inp.value);
   if(!v){msg.textContent='Type your answer first ✨';return}
   if(ok(inp.value)){
    done=true;try{sessionStorage.setItem('bd-open','1')}catch(e){}
    card.classList.add('done');$('seal').textContent='💜';
    burst($('seal'));snow.boost=1;
    setTimeout(()=>{open();gate.classList.add('leave');setTimeout(()=>gate.remove(),950)},1700);
   }else{
    form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
    msg.textContent=nope[wrong%nope.length];wrong++;inp.select();
   }
  };
  $('gateGo').addEventListener('click',go);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
 }
}

/* ---- Scroll journey ---- */
function initJourney(){
 const root=document.documentElement,secs=[...document.querySelectorAll('.chap,.pin')],pars=[...document.querySelectorAll('[data-par]')],rsec=$('reasons');
 $('egrid').innerHTML=letters.map((l,i)=>`<div class="rv" style="--i:${i}"><button class="envelope" data-letter="${i}"><span>${l[0]}</span><b>${l[1]}</b><small>Tap to open ↗</small></button></div>`).join('');
 $('rwrap').innerHTML=reasons.map(t=>`<p class="reason">${t}</p>`).join('');
 $('dots').innerHTML=reasons.map(()=>'<i></i>').join('');
 rsec.style.height=(reasons.length*62+100)+'vh';
 const rs=[...document.querySelectorAll('.reason')],dots=[...document.querySelectorAll('#dots i')];
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add('in');io.unobserve(t);setTimeout(()=>t.classList.add('done'),1600)}}),{threshold:.15,rootMargin:'0px 0px -6% 0px'});
 document.querySelectorAll('.rv').forEach(el=>io.observe(el));
 let lastY=scrollY,tick2=false;
 function upd(){
  tick2=false;const y=scrollY,vh=innerHeight,max=root.scrollHeight-vh;
  root.style.setProperty('--p',max>0?(y/max).toFixed(4):0);
  root.style.setProperty('--hs',Math.min(1,y/vh).toFixed(3));
  const dy=y-lastY;lastY=y;snow.push=Math.max(snow.push||0,Math.min(1,Math.abs(dy)/45));if(dy)snow.dir=Math.sign(dy);
  pars.forEach(el=>{const r=el.getBoundingClientRect();el.style.setProperty('--pp',Math.min(1,Math.max(0,1-(r.top+r.height/2)/vh)).toFixed(3))});
  let c=-1;secs.forEach((x,i)=>{if(x.getBoundingClientRect().top<vh*.5)c=i});
  if(c<0)delete document.body.dataset.ch;else document.body.dataset.ch=c;
  const r=rsec.getBoundingClientRect(),pr=Math.min(.999,Math.max(0,-r.top/(r.height-vh))),idx=Math.floor(pr*rs.length);
  rs.forEach((el,i)=>{el.classList.toggle('on',i===idx);el.classList.toggle('past',i<idx)});
  dots.forEach((d,i)=>d.classList.toggle('on',i<=idx));
 }
 addEventListener('scroll',()=>{if(!tick2){tick2=true;requestAnimationFrame(upd)}},{passive:true});
 addEventListener('resize',upd);upd();
}
</script>
